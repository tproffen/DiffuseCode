# Test manifest for the legacy macro test suite.
#
# Read by tools/run_legacy_tests.py (and tests/python/test_legacy_macros.py).
# Each [[test]] entry runs one macro in a fresh copy of its top-level test
# folder, with LTEST_BATCH = TRUE so that check.mac writes PASS/FAIL lines
# to a result file instead of stopping.
#
# Fields
#   id           unique name, used for filtering and in reports
#   dir          folder below tests/ in which the macro is started
#   macro        macro file name, relative to dir
#   args         macro parameters exactly as typed after @macro (optional)
#   check        "macro"    – runner calls check.mac after the macro (default)
#                "internal" – the macro calls check.mac itself
#                "none"     – no check exists; the test only has to finish
#   checks       number of PASS lines expected (default 1)
#   tags         fast (< 10 s), medium (< 30 s), slow (>= 30 s),
#                mc (stochastic: Monte Carlo / random), mpi, nocheck,
#                exclusive (the macro sets its own OpenMP thread count with
#                "set parallel"; the runner runs it alone, not in parallel)
#   timeout      seconds before the run is killed (default 600)
#   in_test_all  true if test_all.mac runs the same macro (default true)
#   enabled      false to skip, with a reason in skip_reason
#
# Keep this file and test_all.mac in step:
#   python3 tools/run_legacy_tests.py --check-test-all
# reports differences.

