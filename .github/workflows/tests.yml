# Build DiffuseCode with the Python module and run the tests.
#
#   linux              full build with graphics (PGPLOT, X11):
#                      legacy macro tests (tools/run_legacy_tests.py) + pytest
#   python-package     "pip install ." in a virtual environment, without
#                      PGPLOT/X11, on Ubuntu 24.04 and 22.04 (Python 3.10, the
#                      WSL2 default): pytest; Sphinx docs (24.04), uploaded
#                      as the "docs-html" artifact
#   conda              environment.yml (conda-forge only, no admin rights):
#                      pip install . and pytest
#   publish-docs       pushes to claude-python-app only: docs to gh-pages
#
# Development happens on claude-python-app until the first release of the
# Python package; feature branches (claude/**) merge into it.
#
# Which jobs run (job "changes", tools/ci_changes.py):
#   push to claude/**            only what the branch's changes need,
#                                compared with claude-python-app
#   push to claude-python-app    only what the push (the merged PR) needs
#   PR opened or reopened        nothing, if the branch already contains the
#                                latest claude-python-app (the push runs
#                                tested this code); otherwise the PR's
#                                changes on the merge result. Later pushes
#                                to the PR branch run as pushes only.
#   weekly, manual run           everything
# Text only (migration/, *.md outside docs/): nothing. docs/: the docs.
# Python package: pytest (graphics build, Ubuntu 24.04 and 22.04) and docs.
# Fortran, legacy tests: build, legacy tests, pytest on 22.04 (WSL2).
# pyproject.toml, environment.yml, CMake, the f2py wrapper, this workflow:
# everything, conda included.
name: tests

on:
  push:
    branches: [claude-python-app, "claude/**"]
  pull_request:
    branches: [claude-python-app]
    types: [opened, reopened, ready_for_review]
  # Weekly full run. GitHub runs scheduled workflows only from the default
  # branch (master), so this fires once the file is there.
  schedule:
    - cron: "17 4 * * 1"           # Mondays 04:17 UTC
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      legacy: ${{ steps.decide.outputs.legacy }}
      conda: ${{ steps.decide.outputs.conda }}
      docs: ${{ steps.decide.outputs.docs }}
      package_os: ${{ steps.decide.outputs.package_os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # history of claude-python-app for the diff
      - id: decide
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci_changes.py

  linux:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # No FC/CC/CXX and no PGPLOT_DIR: CMake finds the compilers and PGPLOT.
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran cmake make libfftw3-dev libhdf5-dev libreadline-dev \
            libpng-dev libx11-dev zlib1g-dev pgplot5 xvfb \
            python3-dev python3-numpy python3-pytest python3-matplotlib python3-venv

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DDIFFUSE_PYTHON=ON -DPYTHON_EXECUTABLE=/usr/bin/python3 -Wno-dev

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Python environment
        # --system-site-packages: use the apt NumPy/matplotlib/pytest that the
        # compiled module was built against; add gemmi (test references).
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --quiet -r tests/requirements.txt

      - name: Python tests (pytest)
        env:
          DIFFUSE_PYTHON_PATH: ${{ github.workspace }}/build/python
          DIFFUSE_REQUIRE_PYTHON: "1"
          # The f2py module here; the installed-package jobs use the C
          # library (ctypes), so the whole suite runs on both cores.
          DIFFUSE_BACKEND: f2py
          MPLBACKEND: Agg
        # DISCUS_SUITE is not set here, so the legacy macro tests inside
        # pytest are skipped; the next step runs them in parallel.
        run: .venv/bin/python -m pytest tests/python -v -rxs --junitxml=pytest-results.xml

      - name: Legacy macro tests
        if: needs.changes.outputs.legacy == 'true'
        # Tests tagged mc run with "seed 1234" on one thread (repeatable), so
        # no re-runs: the one flaky case (04.sro3, a broken Fourier with
        # OMP_THREAD_LIMIT=1) was a bug in the bundled finufft, fixed in WP2.
        run: |
          python3 tools/run_legacy_tests.py \
            --exe build/suite/prog/discus_suite -j "$(nproc)" \
            --tags fast,mc --junit legacy-results.xml --workdir legacy-work

      - name: Install and run the standalone program (docs/standalone.md)
        # cmake --install as in the docs; the installed discus_suite must run
        # a macro and find its help files in ../share.
        run: |
          prefix="$RUNNER_TEMP/discus-suite"
          cmake --install build --prefix "$prefix" > /dev/null
          test -f "$prefix/share/suite.hlp"
          mkdir -p "$RUNNER_TEMP/standalone" && cd "$RUNNER_TEMP/standalone"
          printf 'r[1] = 6*7\necho "answer %%4.1f", r[1]\nexit\n' > check.mac
          "$prefix/bin/discus_suite" -macro check.mac < /dev/null > out.txt 2>&1 || true
          grep -q "answer 42.0" out.txt || { cat out.txt; exit 1; }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            pytest-results.xml
            legacy-results.xml
            legacy-work/**/*.log
          if-no-files-found: ignore

  # The Python package as users install it: a virtual environment and
  # "pip install .", without graphics (no PGPLOT, X11 or Xvfb installed).
  # Ubuntu 22.04 with Python 3.10 is the WSL2 default (the main development
  # environment); 24.04 builds the docs that get published.
  python-package:
    needs: changes
    if: needs.changes.outputs.package_os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.package_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (no PGPLOT, X11 or Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran cmake make libfftw3-dev libhdf5-dev libreadline-dev zlib1g-dev \
            python3-dev python3-venv

      - name: pip install .[test,docs] into a virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/python --version
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install ".[test,docs]"

      - name: Check that nothing links PGPLOT, X11 or PNG
        run: |
          so=$(.venv/bin/python -c "import diffuse, pathlib; print(next(pathlib.Path(diffuse.__file__).parent.glob('suite_python*.so')))")
          for f in "$so" build/*/suite/prog/discus_suite; do
            echo "$f"
            if ldd "$f" | grep -i -E 'pgplot|libx11|libpng'; then
              echo "::error::$f links graphics libraries"; exit 1
            fi
          done

      - name: Python tests (pytest, installed package)
        env:
          DIFFUSE_REQUIRE_PYTHON: "1"
          DIFFUSE_BACKEND: ctypes          # the C library (the build job tests f2py)
          MPLBACKEND: Agg
        run: .venv/bin/python -m pytest tests/python -v -rxs --junitxml=pytest-${{ matrix.os }}.xml

      - name: Documentation
        if: matrix.os == 'ubuntu-24.04' && (success() || failure())
        env:
          MPLBACKEND: Agg
        # Warnings are errors, so broken docstrings or links fail the build.
        run: .venv/bin/python -m sphinx -W --keep-going -b html docs docs/_build/html

      - name: Upload documentation
        if: matrix.os == 'ubuntu-24.04' && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          if-no-files-found: ignore

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: pytest-${{ matrix.os }}.xml
          if-no-files-found: ignore

  # Users without admin rights: everything from conda-forge (environment.yml),
  # including the compilers; no system packages.
  conda:
    needs: changes
    if: needs.changes.outputs.conda == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}          # activates the conda environment
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: diffuse

      - name: pip install . (inside the conda environment)
        run: |
          conda list | grep -E "^(python|numpy|hdf5|fftw|gfortran|cmake) " || true
          pip install --no-build-isolation .

      - name: Python tests (pytest, installed package)
        env:
          DIFFUSE_REQUIRE_PYTHON: "1"
          DIFFUSE_BACKEND: ctypes          # the C library (the build job tests f2py)
          MPLBACKEND: Agg
        run: python -m pytest tests/python -v -rxs

  # Publish the docs to https://tproffen.github.io/DiffuseCode/python-docs/
  # The gh-pages branch is the DISCUS homepage: tools/publish_docs.sh only
  # replaces python-docs/ (plus an empty .nojekyll at the root) and refuses
  # to publish if anything else would change.
  publish-docs:
    # Only when the docs were built (docs/ or the package changed), and no
    # test job failed; a skipped job is fine.
    needs: [changes, linux, python-package]
    if: >-
      always() && github.event_name == 'push' &&
      github.ref == 'refs/heads/claude-python-app' &&
      needs.changes.outputs.docs == 'true' &&
      needs.python-package.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.linux.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: docs-html

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Put the docs into gh-pages/python-docs
        run: tools/publish_docs.sh docs-html gh-pages

      - name: Commit and push
        working-directory: gh-pages
        run: |
          if git diff --cached --quiet; then
            echo "Docs unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Python docs from ${GITHUB_SHA::7} (claude-python-app)"
          git push origin HEAD:gh-pages
